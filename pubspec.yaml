name: core_acv_test
description: Aplicación de escritorio para probar el core ACV con menú de funciones.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  camera_windows: ^0.2.6
  camera_macos: ^0.2.1
  camera_linux: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
